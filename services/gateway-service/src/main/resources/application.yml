server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/auth/realms/pulsenotify}

pulsenotify:
  gateway:
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:3000
    rate-limit:
      requests-per-minute: 120
    downstream:
      notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8081}
      template:     ${TEMPLATE_SERVICE_URL:http://localhost:8083}
      user:         ${USER_SERVICE_URL:http://localhost:8084}
      audit:        ${AUDIT_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.pulsenotify: INFO
    org.springframework.cloud.gateway: INFO