apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: pulse-notify
  labels:
    app: gateway-service
    app.kubernetes.io/part-of: pulse-notify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: gateway-service
          image: pulsenotify/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pulse-notify-config
            - configMapRef:
                name: gateway-downstream-config
          env:
            - name: JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: pulse-notify-config
                  key: JWT_ISSUER_URI
                  optional: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
