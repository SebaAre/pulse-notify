# Placeholder Secret manifests for local/demo cluster bootstrap.
# DO NOT commit real credentials. In production, generate secrets via:
#
#   kubectl create secret generic postgres-credentials \
#     --from-literal=password=$(openssl rand -base64 32) \
#     --namespace=pulse-notify
#
# For AWS access in delivery-service / audit-service, prefer IRSA
# (IAM Roles for Service Accounts) over static keys.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: pulse-notify
type: Opaque
stringData:
  password: REPLACE_WITH_REAL_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: pulse-notify
type: Opaque
stringData:
  access-key-id: REPLACE_WITH_REAL_ACCESS_KEY
  secret-access-key: REPLACE_WITH_REAL_SECRET_KEY
